# CodeGuardian v1.0: review the Python changes of every pull request.
# Uses pull_request (never pull_request_target), so fork PRs never receive secrets.
name: CodeGuardian review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["**.py"]

# Read-only: the job summary and artifacts need no extra permissions, and no PR comments are posted.
permissions:
  contents: read

# A new push to the same PR cancels the older run, so the same changes are not paid for twice.
concurrency:
  group: codeguardian-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CodeGuardian dependencies
        run: python -m pip install -r requirements.txt

      - name: Review the pull request
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CODEGUARDIAN_VERIFY: ${{ vars.CODEGUARDIAN_VERIFY || 'true' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python .github/scripts/pr_review.py --output codeguardian-report

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeguardian-report
          path: codeguardian-report/
          if-no-files-found: warn
